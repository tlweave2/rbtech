    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>

<body>

  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

nt-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/publicsans/v21/ijwRs572Xtc6ZYQws9YVwnNIfJ7Cww.woff2) format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Public Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"36125bc0-dfde-40d0-8e33-a53372426c14\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#F4F5F1}\na{color:#1D5C73}a:hover{color:#123E4E}\n.ph{background-color:#DCE3DF;background-image:repeating-linear-gradient(135deg,rgba(16,39,43,.06) 0 12px,transparent 12px 24px)}\n.phd{background-color:#1B3A3E;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 12px,transparent 12px 24px)}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family: 'Public Sans', system-ui, sans-serif; color: #10272B; background: #F4F5F1; font-size: 17px; line-height: 1.55\" data-canvas-width=\"1440\" data-canvas-height=\"7600\" data-document-role=\"page\" data-label=\"Homepage redesign\">\n\n<!-- Meeting bar -->\n<div style=\"background: {{sun}}; color: #10272B; padding: 10px 24px; font-size: 15px; font-weight: 600; text-align: center\">\nNext community meeting: [DATE · TIME · LOCATION] &nbsp;<a href=\"#involved\" style=\"color: #10272B; text-decoration: underline\">Details &amp; RSVP<\u002Fa>\n<\u002Fdiv>\n\n<!-- Nav -->\n<header style=\"background: #FFFFFF; border-bottom: 1px solid #DCE1DD\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px\">\n<a href=\"#top\" style=\"display: flex; align-items: center; gap: 12px; text-decoration: none; color: #10272B\">\n<span style=\"width: 40px; height: 40px; border-radius: 8px; background: #10272B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 80%; font-size: 17px; letter-spacing: .02em\">RTC<\u002Fspan>\n<span style=\"display: flex; flex-direction: column; line-height: 1.15\"><span style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 18px\">Riverbank Technology Center<\u002Fspan><span style=\"font-size: 13px; color: #4A5A5D\">Aemetis × Spartan<\u002Fspan><\u002Fspan>\n<\u002Fa>\n<nav aria-label=\"Main\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 4px 22px; font-size: 15px; font-weight: 600\">\n<a href=\"#answers\" style=\"color: #10272B; text-decoration: none; padding: 10px 0\">Your questions<\u002Fa>\n<a href=\"#project\" style=\"color: #10272B; text-decoration: none; padding: 10px 0\">The project<\u002Fa>\n<a href=\"#commitments\" style=\"color: #10272B; text-decoration: none; padding: 10px 0\">Commitments<\u002Fa>\n<a href=\"#benefits\" style=\"color: #10272B; text-decoration: none; padding: 10px 0\">Benefits<\u002Fa>\n<a href=\"#faq\" style=\"color: #10272B; text-decoration: none; padding: 10px 0\">FAQ<\u002Fa>\n<a href=\"#involved\" style=\"background: #1D5C73; color: #FFFFFF; text-decoration: none; padding: 11px 18px; border-radius: 8px\">Get involved<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n\n<!-- Hero -->\n<section id=\"top\" style=\"background: #FFFFFF\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 72px 24px 56px; display: flex; flex-wrap: wrap; gap: 48px; align-items: center\">\n<div style=\"flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n<div style=\"font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #1D5C73\">5300 Claus Rd · Riverbank Industrial Complex<\u002Fdiv>\n<h1 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 82%; font-size: clamp(42px, 5.4vw, 68px); line-height: 1.02; letter-spacing: -.01em\">A quiet computing facility, inside buildings Riverbank already has.<\u002Fh1>\n<p style=\"margin: 0; font-size: 19px; color: #3B4B4E; max-width: 560px\">Aemetis and Spartan are bringing a medium-sized computing facility to existing industrial buildings at the Riverbank Industrial Complex. No city drinking water, no strain on the local grid, no new buildings, and more than $10 million a year in new local tax revenue.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n<a href=\"#answers\" style=\"background: #10272B; color: #FFFFFF; text-decoration: none; padding: 15px 22px; border-radius: 8px; font-weight: 700\">Get straight answers<\u002Fa>\n<a href=\"https://www.riverbanktc.com/assets/RTC-Responsible-Development-Commitments.pdf\" style=\"background: #FFFFFF; color: #10272B; text-decoration: none; padding: 14px 21px; border-radius: 8px; font-weight: 700; border: 1.5px solid #10272B\">Read our 7 commitments (PDF)<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 460px; min-width: 0; position: relative\">\n<div class=\"ph\" role=\"img\" aria-label=\"Photo placeholder: aerial view of the Riverbank Industrial Complex\" style=\"aspect-ratio: 5 / 4; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #4A5A5D; font-size: 14px; font-weight: 600; text-align: center; padding: 24px\">Photo: aerial of the Riverbank Industrial Complex<br>(RiverbankFacilityAerial.jpg)<\u002Fdiv>\n<div style=\"position: absolute; left: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"background: #FFFFFF; padding: 8px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: 0 2px 8px rgba(16,39,43,.15)\">Existing industrial buildings<\u002Fspan>\n<span style=\"background: #FFFFFF; padding: 8px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: 0 2px 8px rgba(16,39,43,.15)\">Equipment 200+ ft from the street<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Fact strip -->\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 0 24px 72px\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1px; background: #DCE1DD; border: 1px solid #DCE1DD; border-radius: 14px; overflow: hidden\">\n<div style=\"background: #F4F5F1; padding: 24px\"><div style=\"font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 80%; font-size: 44px; line-height: 1\">0<\u002Fdiv><div style=\"margin-top: 8px; font-size: 15px; color: #3B4B4E\">gallons of City of Riverbank drinking water<\u002Fdiv><\u002Fdiv>\n<div style=\"background: #F4F5F1; padding: 24px\"><div style=\"font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 80%; font-size: 44px; line-height: 1\">0<\u002Fdiv><div style=\"margin-top: 8px; font-size: 15px; color: #3B4B4E\">new buildings: equipment goes inside existing ones<\u002Fdiv><\u002Fdiv>\n<div style=\"background: #F4F5F1; padding: 24px\"><div style=\"font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 80%; font-size: 44px; line-height: 1\">200+ ft<\u002Fdiv><div style=\"margin-top: 8px; font-size: 15px; color: #3B4B4E\">from the street to any equipment<\u002Fdiv><\u002Fdiv>\n<div style=\"background: #F4F5F1; padding: 24px\"><div style=\"font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 80%; font-size: 44px; line-height: 1\">$10M+<\u002Fdiv><div style=\"margin-top: 8px; font-size: 15px; color: #3B4B4E\">new property tax revenue every year<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Your questions -->\n<section id=\"answers\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 720px; margin-bottom: 48px\">\n<div style=\"font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #1D5C73\">Your questions, straight answers<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 82%; font-size: clamp(34px, 4vw, 48px); line-height: 1.05\">What neighbors ask most about data centers, and what this one does about it.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px\">\n\n<article style=\"background: #FFFFFF; border: 1px solid #DCE1DD; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; align-items: center; gap: 10px; color: #1D5C73; font-weight: 700; font-size: 15px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z\"><\u002Fpath><\u002Fsvg>Water<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 600; color: #3B4B4E\">Will it use Riverbank's water?<\u002Fh3>\n<p style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15\">No city drinking water. Ever.<\u002Fp>\n<p style=\"margin: 0; color: #3B4B4E\">Cooling is a closed loop with air-cooled chillers. It's filled once with recycled, non-drinkable industrial water from existing on-site wells, not municipal or agricultural supplies.<\u002Fp>\n<p style=\"margin: 0; padding-top: 12px; border-top: 1px solid #E6EAE7; font-size: 15px\"><strong>For scale:<\u002Fstrong> that one-time fill is about what two homes use in a year.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FFFFFF; border: 1px solid #DCE1DD; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; align-items: center; gap: 10px; color: #1D5C73; font-weight: 700; font-size: 15px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M13 2 4 14h7l-1 8 9-12h-7z\"><\u002Fpath><\u002Fsvg>Power bills<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 600; color: #3B4B4E\">Will it raise my electric bill?<\u002Fh3>\n<p style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15\">The project pays its own way.<\u002Fp>\n<p style=\"margin: 0; color: #3B4B4E\">Electricity comes from outside the Riverbank area, including renewable hydroelectric power, over transmission lines already built for the site's former heavy industry.<\u002Fp>\n<p style=\"margin: 0; padding-top: 12px; border-top: 1px solid #E6EAE7; font-size: 15px\"><strong>Who pays:<\u002Fstrong> any onsite utility upgrades are paid by the project, not ratepayers or taxpayers.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FFFFFF; border: 1px solid #DCE1DD; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; align-items: center; gap: 10px; color: #1D5C73; font-weight: 700; font-size: 15px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M11 5 6 9H2v6h4l5 4z\"><\u002Fpath><path d=\"M16 9a4 4 0 0 1 0 6\"><\u002Fpath><\u002Fsvg>Noise<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 600; color: #3B4B4E\">Will I hear it?<\u002Fh3>\n<p style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15\">Kept below the limits already allowed.<\u002Fp>\n<p style=\"margin: 0; color: #3B4B4E\">Every piece of computing equipment sits indoors, inside large existing buildings, more than 200 feet from the street. Cooling uses low-decibel chillers.<\u002Fp>\n<p style=\"margin: 0; padding-top: 12px; border-top: 1px solid #E6EAE7; font-size: 15px\"><strong>Check it:<\u002Fstrong> [Link to sound study, when published]<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FFFFFF; border: 1px solid #DCE1DD; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; align-items: center; gap: 10px; color: #1D5C73; font-weight: 700; font-size: 15px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 8h11a3 3 0 1 0-3-3\"><\u002Fpath><path d=\"M3 12h15a3 3 0 1 1-3 3\"><\u002Fpath><path d=\"M3 16h7\"><\u002Fpath><\u002Fsvg>Air<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 600; color: #3B4B4E\">Will it pollute the air?<\u002Fh3>\n<p style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15\">No turbines or big generators running.<\u002Fp>\n<p style=\"margin: 0; color: #3B4B4E\">Day-to-day operation runs on clean grid power. No large gas turbines or generators. Any future onsite power is designed to minimize local air-quality impact.<\u002Fp>\n<p style=\"margin: 0; padding-top: 12px; border-top: 1px solid #E6EAE7; font-size: 15px\"><strong>Check it:<\u002Fstrong> [Link to air permit or filing, when available]<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FFFFFF; border: 1px solid #DCE1DD; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; align-items: center; gap: 10px; color: #1D5C73; font-weight: 700; font-size: 15px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21V10l6-4v4l6-4v4l6-4v15z\"><\u002Fpath><path d=\"M3 21h18\"><\u002Fpath><\u002Fsvg>Land<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 600; color: #3B4B4E\">Is it taking farmland or housing land?<\u002Fh3>\n<p style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15\">No. It's already industrial.<\u002Fp>\n<p style=\"margin: 0; color: #3B4B4E\">The land is zoned industrial. The buildings once supported an aluminum smelter and U.S. Army ammunition casing production. No farmland or potential housing land is converted.<\u002Fp>\n<p style=\"margin: 0; padding-top: 12px; border-top: 1px solid #E6EAE7; font-size: 15px\"><strong>Neighbors:<\u002Fstrong> one of 37 existing tenants at the complex.<\u002Fp>\n<\u002Farticle>\n\n<article style=\"background: #FFFFFF; border: 1px solid #DCE1DD; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; align-items: center; gap: 10px; color: #1D5C73; font-weight: 700; font-size: 15px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"6\" rx=\"1\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"18\" height=\"6\" rx=\"1\"><\u002Frect><path d=\"M7 7h.01M7 17h.01\"><\u002Fpath><\u002Fsvg>Size<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 600; color: #3B4B4E\">How big is it?<\u002Fh3>\n<p style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.15\">Medium-sized. Not a mega data center.<\u002Fp>\n<p style=\"margin: 0; color: #3B4B4E\">A modular computing facility that fits inside existing buildings, with no unsightly new structures built for computing.<\u002Fp>\n<p style=\"margin: 0; padding-top: 12px; border-top: 1px solid #E6EAE7; font-size: 15px\"><strong>Capacity:<\u002Fstrong> [MW / square footage, if you choose to publish]<\u002Fp>\n<\u002Farticle>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- How it works -->\n<section id=\"project\" style=\"background: #0F2629; color: #EEF2EF\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-end; margin-bottom: 48px\">\n<div style=\"flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: {{sun}}\">How it works<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 82%; font-size: clamp(34px, 4vw, 48px); line-height: 1.05\">The first Sustainable Computing Facility in the US.<\u002Fh2>\n<\u002Fdiv>\n<p style=\"flex: 1 1 400px; min-width: 0; margin: 0; color: #A9BBB8\">An SCF is our standard for computing infrastructure that adds jobs and steady tax revenue without polluting or depleting local resources. Here's the whole system in three parts.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px\">\n<div style=\"background: #163437; border: 1px solid #2A4B4F; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"font-family: Archivo, sans-serif; font-weight: 800; font-size: 15px; color: {{sun}}\">01 · POWER IN<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-size: 24px; font-weight: 700\">From outside Riverbank<\u002Fh3>\n<p style=\"margin: 0; color: #C3D1CE\">Renewable hydroelectric and other sources, delivered over grid and transmission capacity already built to serve the site. No new capacity required, and excess power can go back to the grid.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #163437; border: 1px solid #2A4B4F; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"font-family: Archivo, sans-serif; font-weight: 800; font-size: 15px; color: {{sun}}\">02 · COMPUTING<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-size: 24px; font-weight: 700\">Inside existing buildings<\u002Fh3>\n<p style=\"margin: 0; color: #C3D1CE\">High-performance computing equipment housed entirely indoors in large existing industrial buildings, set back more than 200 feet from the street.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #163437; border: 1px solid #2A4B4F; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"font-family: Archivo, sans-serif; font-weight: 800; font-size: 15px; color: {{sun}}\">03 · COOLING<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-size: 24px; font-weight: 700\">A closed loop, filled once<\u002Fh3>\n<p style=\"margin: 0; color: #C3D1CE\">Low-decibel, air-cooled chillers circulate the same water continuously. The one-time fill uses recycled, non-drinkable water already on site.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px\">\n<div class=\"phd\" role=\"img\" aria-label=\"Photo placeholder: computing equipment inside an existing industrial building\" style=\"aspect-ratio: 16 / 9; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #A9BBB8; font-size: 14px; font-weight: 600; text-align: center; padding: 24px\">Photo: equipment inside an existing building<br>(Indoor-RIC.png)<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: #2A4B4F; border-radius: 14px; overflow: hidden\">\n<div style=\"background: #0F2629; padding: 22px\"><div style=\"font-weight: 700; color: {{sun}}; font-size: 14px\">REUSE<\u002Fdiv><div style=\"margin-top: 6px; color: #C3D1CE; font-size: 15px\">Buildings once used for aluminum smelting and Army ammunition casings.<\u002Fdiv><\u002Fdiv>\n<div style=\"background: #0F2629; padding: 22px\"><div style=\"font-weight: 700; color: {{sun}}; font-size: 14px\">SETBACK<\u002Fdiv><div style=\"margin-top: 6px; color: #C3D1CE; font-size: 15px\">All equipment more than 200 ft from the street, all indoors.<\u002Fdiv><\u002Fdiv>\n<div style=\"background: #0F2629; padding: 22px\"><div style=\"font-weight: 700; color: {{sun}}; font-size: 14px\">ZONING<\u002Fdiv><div style=\"margin-top: 6px; color: #C3D1CE; font-size: 15px\">Already zoned industrial. No rezoning of farmland or housing land.<\u002Fdiv><\u002Fdiv>\n<div style=\"background: #0F2629; padding: 22px\"><div style=\"font-weight: 700; color: {{sun}}; font-size: 14px\">SCALE<\u002Fdiv><div style=\"margin-top: 6px; color: #C3D1CE; font-size: 15px\">One of 37 existing tenants at the complex.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Commitments -->\n<section id=\"commitments\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: flex-end; justify-content: space-between; margin-bottom: 40px\">\n<div style=\"flex: 1 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #1D5C73\">Responsible Development Commitments<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 82%; font-size: clamp(34px, 4vw, 48px); line-height: 1.05\">Seven promises. And how you can hold us to them.<\u002Fh2>\n<p style=\"margin: 0; color: #3B4B4E\">Published for our neighbors, Riverbank city leaders and Stanislaus County officials. They govern this project from design through daily operation.<\u002Fp>\n<\u002Fdiv>\n<a href=\"https://www.riverbanktc.com/assets/RTC-Responsible-Development-Commitments.pdf\" style=\"background: #10272B; color: #FFFFFF; text-decoration: none; padding: 15px 22px; border-radius: 8px; font-weight: 700\">Download the full PDF<\u002Fa>\n<\u002Fdiv>\n\n<div style=\"background: #FFFFFF; border: 1px solid #DCE1DD; border-radius: 14px; overflow: hidden\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px 32px; padding: 14px 28px; background: #E9EDEA; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #3B4B4E\"><span>We will<\u002Fspan><span>What that means<\u002Fspan><span>How you can check<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{commitments}}\" as=\"c\" hint-placeholder-count=\"7\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px 32px; padding: 22px 28px; border-top: 1px solid #E6EAE7; align-items: start\">\n<div style=\"display: flex; gap: 14px; align-items: baseline\"><span style=\"font-family: Archivo, sans-serif; font-weight: 800; color: #1D5C73; font-size: 18px\">{{c.n}}<\u002Fspan><span style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.2\">{{c.title}}<\u002Fspan><\u002Fdiv>\n<div style=\"color: #3B4B4E; font-size: 16px\">{{c.means}}<\u002Fdiv>\n<div style=\"color: #3B4B4E; font-size: 16px\">{{c.check}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Benefits -->\n<section id=\"benefits\" style=\"background: #FFFFFF; border-top: 1px solid #DCE1DD; border-bottom: 1px solid #DCE1DD\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 720px; margin-bottom: 48px\">\n<div style=\"font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #1D5C73\">What Riverbank gets<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 82%; font-size: clamp(34px, 4vw, 48px); line-height: 1.05\">Recurring revenue for the things a town runs on.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px; border-top: 4px solid {{sun}}; padding-top: 20px\">\n<div style=\"font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 78%; font-size: 64px; line-height: 1\">$10M+<span style=\"font-size: 28px\">/yr<\u002Fspan><\u002Fdiv>\n<div style=\"color: #3B4B4E\">New property tax revenue for Stanislaus County and Riverbank.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; border-top: 4px solid {{sun}}; padding-top: 20px\">\n<div style=\"font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 78%; font-size: 64px; line-height: 1\">$5M+<span style=\"font-size: 28px\">/yr<\u002Fspan><\u002Fdiv>\n<div style=\"color: #3B4B4E\">Of that total, going to local schools every year.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; border-top: 4px solid {{sun}}; padding-top: 20px\">\n<div style=\"font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 78%; font-size: 64px; line-height: 1\">Hundreds<\u002Fdiv>\n<div style=\"color: #3B4B4E\">Of construction jobs, plus lasting local service jobs.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 48px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px\">\n<span style=\"font-weight: 700; margin-right: 6px\">Property tax funds:<\u002Fspan>\n<span style=\"background: #F4F5F1; border: 1px solid #DCE1DD; padding: 8px 14px; border-radius: 999px; font-size: 15px\">Schools<\u002Fspan>\n<span style=\"background: #F4F5F1; border: 1px solid #DCE1DD; padding: 8px 14px; border-radius: 999px; font-size: 15px\">Fire protection<\u002Fspan>\n<span style=\"background: #F4F5F1; border: 1px solid #DCE1DD; padding: 8px 14px; border-radius: 999px; font-size: 15px\">Libraries<\u002Fspan>\n<span style=\"background: #F4F5F1; border: 1px solid #DCE1DD; padding: 8px 14px; border-radius: 999px; font-size: 15px\">Parks<\u002Fspan>\n<span style=\"background: #F4F5F1; border: 1px solid #DCE1DD; padding: 8px 14px; border-radius: 999px; font-size: 15px\">Local government<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin: 24px 0 0; font-size: 14px; color: #4A5A5D\">Source: [cite the basis for these estimates, e.g. assessor projection or third-party study]<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Timeline -->\n<section id=\"timeline\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 720px; margin-bottom: 40px\">\n<div style=\"font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #1D5C73\">Where things stand<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 82%; font-size: clamp(34px, 4vw, 48px); line-height: 1.05\">Project timeline<\u002Fh2>\n<\u002Fdiv>\n<ol style=\"list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0\">\n<sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"5\">\n<li style=\"border-top: 4px solid {{s.bar}}; padding: 18px 20px 0 0; display: flex; flex-direction: column; gap: 6px\">\n<span style=\"font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: {{s.statusColor}}\">{{s.status}}<\u002Fspan>\n<span style=\"font-family: Archivo, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.2\">{{s.title}}<\u002Fspan>\n<span style=\"font-size: 15px; color: #4A5A5D\">{{s.when}}<\u002Fspan>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<\u002Fsection>\n\n<!-- Who we are -->\n<section id=\"who\" style=\"background: #FFFFFF; border-top: 1px solid #DCE1DD\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 48px\">\n<div style=\"flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #1D5C73\">Who we are<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 82%; font-size: clamp(34px, 4vw, 48px); line-height: 1.05\">Built with Riverbank, not just in it.<\u002Fh2>\n<p style=\"margin: 0; color: #3B4B4E\">Two partners: one with deep local roots, one with the engineering to build quiet, unobtrusive computing facilities.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 14px; margin-top: 8px\">\n<div style=\"border: 1px solid #DCE1DD; border-radius: 12px; padding: 22px\"><div style=\"font-family: Archivo, sans-serif; font-weight: 800; font-size: 22px\">Aemetis<\u002Fdiv><div style=\"margin-top: 6px; color: #3B4B4E\">Renewable fuels and low-carbon energy producer. Master developer of the Riverbank Industrial Complex since 2022, and one of the largest property taxpayers in Stanislaus County.<\u002Fdiv><\u002Fdiv>\n<div style=\"border: 1px solid #DCE1DD; border-radius: 12px; padding: 22px\"><div style=\"font-family: Archivo, sans-serif; font-weight: 800; font-size: 22px\">Spartan<\u002Fdiv><div style=\"margin-top: 6px; color: #3B4B4E\">Designs and delivers modular computing facilities, built for speed and reliability.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 520px; min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px\">\n<figure style=\"margin: 0\"><div class=\"ph\" role=\"img\" aria-label=\"Photo placeholder: Fourth of July\" style=\"aspect-ratio: 4 / 3; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #4A5A5D; font-size: 13px; font-weight: 600\">FourthOfJulyBalloons.jpg<\u002Fdiv><figcaption style=\"margin-top: 8px; font-size: 14px; font-weight: 600\">Fourth of July<\u002Ffigcaption><\u002Ffigure>\n<figure style=\"margin: 0\"><div class=\"ph\" role=\"img\" aria-label=\"Photo placeholder: United We Float\" style=\"aspect-ratio: 4 / 3; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #4A5A5D; font-size: 13px; font-weight: 600\">UnitedWeFloat.jpg<\u002Fdiv><figcaption style=\"margin-top: 8px; font-size: 14px; font-weight: 600\">United We Float<\u002Ffigcaption><\u002Ffigure>\n<figure style=\"margin: 0\"><div class=\"ph\" role=\"img\" aria-label=\"Photo placeholder: community bike ride\" style=\"aspect-ratio: 4 / 3; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #4A5A5D; font-size: 13px; font-weight: 600\">BikeRide.jpg<\u002Fdiv><figcaption style=\"margin-top: 8px; font-size: 14px; font-weight: 600\">Community Bike Ride<\u002Ffigcaption><\u002Ffigure>\n<figure style=\"margin: 0\"><div class=\"ph\" role=\"img\" aria-label=\"Photo placeholder: local police partnership\" style=\"aspect-ratio: 4 / 3; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #4A5A5D; font-size: 13px; font-weight: 600\">PoliceBikes.jpg<\u002Fdiv><figcaption style=\"margin-top: 8px; font-size: 14px; font-weight: 600\">Local Police Partnership<\u002Ffigcaption><\u002Ffigure>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- FAQ -->\n<section id=\"faq\" style=\"max-width: 900px; margin: 0 auto; padding: 96px 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; margin-bottom: 32px\">\n<div style=\"font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #1D5C73\">FAQ<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 82%; font-size: clamp(34px, 4vw, 48px); line-height: 1.05\">More questions<\u002Fh2>\n<\u002Fdiv>\n<div style=\"border-top: 1px solid #C9D1CD\">\n<sc-for list=\"{{faqs}}\" as=\"f\" hint-placeholder-count=\"7\">\n<div style=\"border-bottom: 1px solid #C9D1CD\">\n<button type=\"button\" sc-camel-on-click=\"{{f.toggle}}\" aria-expanded=\"{{f.expanded}}\" style=\"width: 100%; background: transparent; border: 0; padding: 22px 0; display: flex; justify-content: space-between; align-items: center; gap: 16px; text-align: left; cursor: pointer; font-family: Archivo, sans-serif; font-weight: 700; font-size: 20px; color: #10272B; min-height: 44px\">\n<span>{{f.q}}<\u002Fspan>\n<span style=\"font-size: 26px; font-weight: 500; color: #1D5C73; width: 28px; text-align: center; flex: none\">{{f.sign}}<\u002Fspan>\n<\u002Fbutton>\n<sc-if value=\"{{f.open}}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0; padding: 0 40px 24px 0; color: #3B4B4E\">{{f.a}}<\u002Fp>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Get involved -->\n<section id=\"involved\" style=\"background: #0F2629; color: #EEF2EF\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 720px; margin-bottom: 48px\">\n<div style=\"font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: {{sun}}\">Get involved<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: Archivo, sans-serif; font-weight: 800; font-stretch: 82%; font-size: clamp(34px, 4vw, 48px); line-height: 1.05\">Let's build the future of Riverbank together.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px\">\n\n<div style=\"background: #163437; border: 1px solid #2A4B4F; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-size: 24px; font-weight: 700\">Come to a community meeting<\u002Fh3>\n<p style=\"margin: 0; color: #C3D1CE\">[DATE · TIME]<br>[LOCATION, Riverbank]<\u002Fp>\n<p style=\"margin: 0; color: #C3D1CE\">Meet the team, see the site plans and ask anything.<\u002Fp>\n<a href=\"#involved\" style=\"margin-top: auto; align-self: flex-start; background: {{sun}}; color: #10272B; text-decoration: none; padding: 13px 18px; border-radius: 8px; font-weight: 700\">RSVP<\u002Fa>\n<\u002Fdiv>\n\n<div style=\"background: #163437; border: 1px solid #2A4B4F; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-size: 24px; font-weight: 700\">Get project updates<\u002Fh3>\n<p style=\"margin: 0; color: #C3D1CE\">Milestones, meeting notices and new documents, a few times a year.<\u002Fp>\n<form style=\"margin-top: auto; display: flex; flex-direction: column; gap: 8px\">\n<label for=\"rtc-email\" style=\"font-size: 14px; font-weight: 600\">Email address<\u002Flabel>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<input id=\"rtc-email\" type=\"email\" placeholder=\"you@example.com\" style=\"flex: 1 1 180px; min-width: 0; padding: 12px 14px; border-radius: 8px; border: 1px solid #4A6A6E; background: #0F2629; color: #EEF2EF; font: inherit; font-size: 16px; min-height: 44px; box-sizing: border-box\">\n<button type=\"button\" style=\"background: {{sun}}; color: #10272B; border: 0; padding: 12px 18px; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; min-height: 44px\">Sign up<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fform>\n<\u002Fdiv>\n\n<div style=\"background: #163437; border: 1px solid #2A4B4F; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-size: 24px; font-weight: 700\">Ask us directly<\u002Fh3>\n<p style=\"margin: 0; color: #C3D1CE\">Community questions, education programs and local events. We answer every message.<\u002Fp>\n<a href=\"mailto:Community@aemetis.com\" style=\"color: {{sun}}; font-weight: 700; font-size: 18px\">Community@aemetis.com<\u002Fa>\n<p style=\"margin: 0; color: #C3D1CE; font-size: 15px\">Business or site partnership inquiries use the same address.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top: 48px; border-top: 1px solid #2A4B4F; padding-top: 32px; display: flex; flex-direction: column; gap: 16px\">\n<h3 style=\"margin: 0; font-family: Archivo, sans-serif; font-size: 22px; font-weight: 700\">Project documents<\u002Fh3>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px\">\n<a href=\"https://www.riverbanktc.com/assets/RTC-Responsible-Development-Commitments.pdf\" style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px; border: 1px solid #2A4B4F; border-radius: 10px; color: #EEF2EF; text-decoration: none; font-weight: 600\">Responsible Development Commitments<span style=\"font-size: 13px; color: #A9BBB8\">PDF<\u002Fspan><\u002Fa>\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px; border: 1px dashed #4A6A6E; border-radius: 10px; color: #A9BBB8; font-weight: 600\">[Site plan]<span style=\"font-size: 13px\">Coming<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px; border: 1px dashed #4A6A6E; border-radius: 10px; color: #A9BBB8; font-weight: 600\">[Sound study]<span style=\"font-size: 13px\">Coming<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px; border: 1px dashed #4A6A6E; border-radius: 10px; color: #A9BBB8; font-weight: 600\">[Water use summary]<span style=\"font-size: 13px\">Coming<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Footer -->\n<footer style=\"background: #0A1C1E; color: #A9BBB8; font-size: 14px\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 32px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px\">\n<div>© 2026 Riverbank Technology Center · A joint project of Aemetis &amp; Spartan<\u002Fdiv>\n<a href=\"https://www.google.com/maps/search/?api=1&amp;query=5300+Claus+Rd+Riverbank+CA+95367\" style=\"color: #C3D1CE\">5300 Claus Rd, Riverbank, CA 95367<\u002Fa>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;sun&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E8A93A&quot;,&quot;options&quot;:[&quot;#E8A93A&quot;,&quot;#F2C14E&quot;,&quot;#E07A4B&quot;,&quot;#9CC5A1&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:7600}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { open: 0 };\n  }\n  renderVals() {\n    var self = this;\n    var sun = this.props.sun ?? '#E8A93A';\n    var commitments = [\n      { n: '01', title: 'Protect the local grid and electricity rates', means: 'Power from outside Riverbank over existing lines. The project pays for its own onsite upgrades.', check: '[Utility agreement or letter, when available]' },\n      { n: '02', title: 'Use water responsibly', means: 'Closed-loop cooling, filled once with recycled on-site water. No city drinking water.', check: '[Water use summary]' },\n      { n: '03', title: 'Keep operations clean and quiet', means: 'Equipment indoors, low-decibel chillers, no turbines or generators running.', check: '[Third-party sound study]' },\n      { n: '04', title: 'Design with neighbors in mind, on existing industrial land', means: 'Existing buildings on industrial land, 200+ ft from the street.', check: '[Site plan]' },\n      { n: '05', title: 'Engage regularly with the community', means: '[Summary from the PDF, e.g. meeting cadence]', check: '[Meeting schedule and past notes]' },\n      { n: '06', title: 'Explain community benefits clearly', means: '$10M+/yr in property tax, $5M+/yr for schools, hundreds of construction jobs.', check: '[Basis for the tax estimate]' },\n      { n: '07', title: 'Follow through on our commitments', means: '[Summary from the PDF, e.g. annual reporting]', check: '[Annual progress report]' }\n    ];\n    var done = '#1D5C73', next = sun, later = '#C9D1CD';\n    var steps = [\n      { status: 'Done', title: 'Commitments published', when: '[Month 2026]', bar: done, statusColor: '#1D5C73' },\n      { status: 'Now', title: 'Community engagement', when: 'Ongoing', bar: next, statusColor: '#8A5A0B' },\n      { status: 'Next', title: 'City & County review', when: '[Expected date]', bar: later, statusColor: '#4A5A5D' },\n      { status: 'Later', title: 'Construction inside existing buildings', when: '[Expected date]', bar: later, statusColor: '#4A5A5D' },\n      { status: 'Later', title: 'Operations begin', when: '[Expected date]', bar: later, statusColor: '#4A5A5D' }\n    ];\n    var raw = [\n      { q: 'What is a Sustainable Computing Facility (SCF)?', a: 'Our standard for computing infrastructure: zero continuous cooling water, power from existing grid capacity, reuse of existing industrial buildings, industrial land only, and large recurring local tax revenue. Riverbank Technology Center is the first project built to it.' },\n      { q: 'Where exactly is it?', a: 'Inside existing buildings at the Riverbank Industrial Complex, 5300 Claus Rd, Riverbank. All equipment sits more than 200 feet from the street.' },\n      { q: 'What will the facility be used for?', a: 'It will house high-performance computing equipment in a modular, medium-sized facility.' },\n      { q: 'Where does the electricity come from?', a: 'From outside the Riverbank area, including renewable hydroelectric power, delivered over grid infrastructure originally built for the site’s former heavy industry. It does not strain local grid capacity, and excess power can be supplied back to the grid.' },\n      { q: 'Where does the cooling water come from?', a: 'Recycled, non-drinkable industrial water from existing on-site wells, used once to fill a closed loop. No City of Riverbank drinking water and no agricultural supply.' },\n      { q: 'Will there be generators or gas turbines?', a: 'No large, loud generators or gas turbines for day-to-day power. Any onsite power in the future is designed to minimize local air-quality impact.' },\n      { q: 'How can I raise a concern?', a: 'Email Community@aemetis.com or come to the next community meeting. [Add response-time commitment if you want one.]' }\n    ];\n    var faqs = raw.map(function (f, i) {\n      var isOpen = self.state.open === i;\n      return {\n        q: f.q, a: f.a, open: isOpen,\n        expanded: isOpen ? 'true' : 'false',\n        sign: isOpen ? '−' : '+',\n        toggle: function () { self.setState({ open: isOpen ? -1 : i }); }\n      };\n    });\n    return { sun: sun, commitments: commitments, steps: steps, faqs: faqs };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
