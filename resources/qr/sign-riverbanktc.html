<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>RTC QR sign</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@500;600&display=swap">
<style>
@page { size: 8.5in 11in; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 8.5in; height: 11in; }
body { position: relative; overflow: hidden; background: #fff; color: #0b2842; font-family: "Inter", sans-serif; text-align: center; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.logo { width: 4.4in; margin: .5in auto 0; border-radius: .16in; overflow: hidden; }
.logo img { width: 100%; display: block; }
.wm { display: inline-flex; flex-direction: column; align-items: flex-start; gap: .07in; padding-left: .14in; border-left: .06in solid #4c9225; margin-top: .6in; line-height: 1; }
.wm b { font: 900 .5in/1 "Montserrat", sans-serif; text-transform: uppercase; }
.wm small { font: 600 .16in/1 "Montserrat", sans-serif; text-transform: uppercase; letter-spacing: .32em; color: #516779; }
.kicker { display: inline-block; margin: .42in 0 .18in; background: #4c9225; color: #fff; font: 700 .2in/1 "Montserrat", sans-serif; letter-spacing: .3em; text-transform: uppercase; padding: .12in .22in; }
h1 { margin: 0; font: 900 .86in/.95 "Montserrat", sans-serif; text-transform: uppercase; letter-spacing: -.01em; }
h1 span { color: #1586c2; }
.qr { width: 4.4in; height: 4.4in; margin: .3in auto .16in; padding: .1in; border: .05in solid #0b2842; border-radius: .22in; background: #fff; }
.qr img { width: 100%; height: 100%; display: block; }
.tag { margin: 0; font: 800 .3in/1.2 "Montserrat", sans-serif; }
.list { margin: .1in 0 0; font: 600 .19in/1.4 "Inter", sans-serif; color: #516779; }
.url { margin: .08in 0 0; font: 700 .2in/1.3 "Montserrat", sans-serif; color: #0473b8; }
.waves { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 1.15in; display: block; }
</style></head><body>
<div class="logo"><img src="rtc-logo.png" alt="RTC Riverbank Technology Center"></div>
<div class="kicker">Community Resource Hub</div>
<h1>Scan <span>me</span></h1>
<div class="qr"><img src="qr-riverbanktc.svg" alt="QR code"></div>
<p class="tag">Explore. Connect. Stay Informed.</p>
<p class="list">Website &middot; LinkedIn &middot; Facebook &middot; Instagram &middot; Email the team</p></p>
<p class="url">riverbanktc.com/resources</p>
<svg class="waves" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40C240 6 480 8 720 36s480 46 720 8V120H0Z" fill="#6ca13e"/><path d="M0 58C260 28 520 30 760 54s460 40 680 10V120H0Z" fill="#1586c2"/><path d="M0 76C280 52 560 54 800 72s420 32 640 12V120H0Z" fill="#01284d"/></svg>
</body></html>
