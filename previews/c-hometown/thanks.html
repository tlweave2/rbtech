<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you | Riverbank Technology Center</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root { --bg: #f4f8fb; --ink: #0b2842; --ink-2: #516779; --blue: #1586c2; --green: #3e7a1c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0a1a2b; --ink: #e9f0f6; --ink-2: #a3b6c6; --green: #8cc66a; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0a1a2b; --ink: #e9f0f6; --ink-2: #a3b6c6; --green: #8cc66a; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 400 17px/1.6 "Inter", system-ui, sans-serif; }
header { padding: 18px 16px; border-bottom: 1px solid rgba(11,40,66,.12); }
.wm { display: inline-flex; flex-direction: column; gap: 5px; padding-left: 12px; border-left: 3px solid #4c9225; text-decoration: none; color: var(--ink); line-height: 1; }
.wm b { font: 900 1.3rem/1 "Montserrat", sans-serif; text-transform: uppercase; }
.wm small { font: 600 .62rem/1 "Montserrat", sans-serif; text-transform: uppercase; letter-spacing: .3em; }
main { flex: 1; display: grid; place-items: center; padding: 48px 16px; }
.box { max-width: 560px; text-align: center; }
.kicker { font: 700 .78rem "Montserrat", sans-serif; letter-spacing: .24em; text-transform: uppercase; color: var(--green); margin: 0 0 12px; }
h1 { font: 800 clamp(2rem, 5vw, 2.8rem)/1.1 "Montserrat", sans-serif; letter-spacing: -.02em; margin: 0 0 14px; }
p { color: var(--ink-2); margin: 0 0 26px; }
a.btn { display: inline-block; background: var(--blue); color: #fff; font-weight: 700; text-decoration: none; padding: 14px 22px; border-radius: 999px; }
footer { background: #01284d; color: #c4d3df; text-align: center; padding: 22px 16px; font-size: .88rem; }
</style>
</head>
<body>
<header><a class="wm" href="./" aria-label="Riverbank Technology Center, home"><b>Riverbank</b><small>Technology Center</small></a></header>
<main>
  <div class="box">
    <p class="kicker">Thank you</p>
    <h1>We received your submission.</h1>
    <p>It has been sent to the Riverbank Technology Center team at info@riverbanktc.com.</p>
    <a class="btn" href="./">Back to the site</a>
  </div>
</main>
<footer>&copy; 2026 Riverbank Technology Center &middot; A joint project of Aemetis &amp; Spartan</footer>
</body>
</html>
